# Комплект: платформа + продукты из PLATFORM_PRODUCTS в режиме AUTH_MODE=platform, один PostgreSQL-кластер.
# Запускать через обёртку, которая дописывает сервисы продуктов: deploy/suite.sh up -d --wait
# (см. docs/INSTALL.md, раздел «Комплект»). Напрямую `docker compose -f docker-compose.suite.yml` не поднимет продукты.
#
# Продуктов здесь нет намеренно (roadmap §1а): deploy/suite.sh генерирует deploy/.generated/suite.products.yml
# по PLATFORM_PRODUCTS и переменным <ID>_IMAGE, <ID>_WEB_IMAGE, <ID>_DB_PASSWORD из .env.

name: platform-suite

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  gateway:
    image: ${PLATFORM_GATEWAY_IMAGE:-platform-gateway:local}
    build: ./gateway
    restart: unless-stopped
    depends_on:
      platform-api:
        condition: service_healthy
      platform-web:
        condition: service_healthy
    # Переменные продуктов (<ID>_API_UPSTREAM и т. п.) добавляет deploy/suite.sh.
    environment:
      PLATFORM_API_UPSTREAM: http://platform-api:8000
      PLATFORM_WEB_UPSTREAM: http://platform-web:8080
    volumes:
      - ${TLS_DIR:-./deploy/tls}:/etc/nginx/tls:ro
    ports:
      - "${PLATFORM_GATEWAY_BIND:-127.0.0.1}:${PLATFORM_GATEWAY_PORT:-18090}:8080"
      - "${PLATFORM_GATEWAY_BIND:-127.0.0.1}:${PLATFORM_GATEWAY_TLS_PORT:-18443}:8443"
    logging: *logging

  platform-api:
    image: ${PLATFORM_API_IMAGE:-platform-api:local}
    build: ./api
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    # Свой пользователь БД с правами только на базу platform; остальные переменные — из deploy/suite.sh.
    environment:
      DATABASE_URL: postgresql+psycopg://platform:${PLATFORM_DB_PASSWORD:?задайте PLATFORM_DB_PASSWORD}@db:5432/platform
    ports:
      - "127.0.0.1:${PLATFORM_API_PORT:-18010}:8000"
    logging: *logging

  platform-web:
    image: ${PLATFORM_WEB_IMAGE:-platform-web:local}
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    logging: *logging

  # Один кластер на всех. Суперпользователь postgres нужен только db-init и скриптам backup/restore.
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?задайте POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --encoding=UTF8 --locale=C.UTF-8
    volumes:
      - suite-db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${PLATFORM_DB_PORT:-15440}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging: *logging

  # Разовая настройка при каждом запуске (идемпотентно): база и пользователь на платформу и на каждый продукт,
  # пароли — из .env. Пароли продуктов (<ID>_DB_PASSWORD) добавляет deploy/suite.sh.
  db-init:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "/provision.sh"]
    environment:
      PGHOST: db
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?задайте POSTGRES_SUPERUSER_PASSWORD}
      PLATFORM_PRODUCTS: ${PLATFORM_PRODUCTS:-scanner,vm,grc}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?задайте PLATFORM_DB_PASSWORD}
    volumes:
      - ./deploy/db/provision.sh:/provision.sh:ro
    logging: *logging

volumes:
  suite-db:
