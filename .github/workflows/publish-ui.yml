# Публикация @platform/ui в GitHub Packages по тегу ui-vX.Y.Z.
# GitHub Packages требует scope владельца репозитория, поэтому пакет публикуется как
# @azuresong-afk/platform-ui; продукты подключают его алиасом:
#   "@platform/ui": "npm:@azuresong-afk/platform-ui@^1"
name: Publish @platform/ui

on:
  push:
    tags: ["ui-v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@azuresong-afk"
      - run: npm ci
      - run: npm test -w @platform/ui
      - run: npm run build -w @platform/ui
      - name: Версия пакета совпадает с тегом
        working-directory: packages/ui
        run: test "ui-v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Публикация под scope владельца
        working-directory: packages/ui
        run: |
          npm pkg set name=@azuresong-afk/platform-ui
          npm pkg set publishConfig.registry=https://npm.pkg.github.com
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
