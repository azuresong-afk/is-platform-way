name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API (pytest, ruff, миграции на PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: platform_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: api
    env:
      PLATFORM_TEST_PG_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/platform_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  fakes:
    name: Заглушки продуктов
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest ruff
      - run: ruff check .
      - run: pytest

  web:
    name: Фронтенд (lint, typecheck, тесты, сборка)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:showcase -w @platform/ui

  images:
    name: Сборка образов и проверка конфигурации шлюза
    runs-on: ubuntu-latest
    needs: [api, fakes, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t platform-api api
      - run: docker build -t platform-web -f web/Dockerfile .
      - run: docker build -t platform-gateway gateway
      - run: docker build --build-arg PRODUCT=fake-scanner -t fake-scanner dev
      - name: nginx -t для конфигураций без TLS и с TLS
        run: |
          docker run --rm -e SCANNER_API_UPSTREAM=http://a:8000 -e SCANNER_WEB_UPSTREAM=http://b:8080 \
            --entrypoint sh platform-gateway -c "/docker-entrypoint.d/05-render-gateway.sh && nginx -t"
          mkdir -p tls && openssl req -x509 -newkey rsa:2048 -nodes -keyout tls/privkey.pem -out tls/fullchain.pem \
            -days 1 -subj /CN=localhost && chmod 644 tls/*.pem
          docker run --rm -v "$PWD/tls:/etc/nginx/tls:ro" -e TLS_CERT=/etc/nginx/tls/fullchain.pem \
            -e TLS_KEY=/etc/nginx/tls/privkey.pem --entrypoint sh platform-gateway \
            -c "/docker-entrypoint.d/05-render-gateway.sh && nginx -t"

  e2e:
    name: e2e единого входа (Playwright на заглушках)
    runs-on: ubuntu-latest
    needs: [api, fakes, web]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Стенд (docker compose, профиль fakes)
        run: npm run stack:up
      - run: npm run e2e
        env:
          CI: "1"
      - name: Логи стенда
        if: failure()
        run: npm run stack:logs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      - name: Остановить стенд
        if: always()
        run: npm run stack:down
